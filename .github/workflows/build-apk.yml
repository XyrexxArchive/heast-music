name: Heast Music v4.0.0 Build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Heast Music APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebrand repository to Heast v4.0.0
        run: |
          if [ -f scripts/rebrand-v4.py ]; then
            python3 scripts/rebrand-v4.py
          fi
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git restore -- .github/workflows/build-apk.yml
            git add -A
            git commit -m "chore: complete Heast v4.0.0 rebrand"
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Heast Native Core
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          cargo ndk -t arm64-v8a -t armeabi-v7a -o app/src/main/jniLibs build --release --manifest-path kuro-core/Cargo.toml

      - name: Build Release and Debug APKs
        run: ./gradlew --no-daemon assembleRelease assembleDebug --stacktrace

      - name: Name APKs with app version
        id: apk
        shell: bash
        run: |
          VERSION_NAME=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$VERSION_NAME" || { echo "Could not read app versionName"; exit 1; }

          RELEASE_DIR="app/build/outputs/apk/release"
          DEBUG_DIR="app/build/outputs/apk/debug"

          if [ -f "$RELEASE_DIR/app-universal-release.apk" ]; then
            cp "$RELEASE_DIR/app-universal-release.apk" "$RELEASE_DIR/heast-music-v$VERSION_NAME-release.apk"
          else
            cp "$RELEASE_DIR/app-release.apk" "$RELEASE_DIR/heast-music-v$VERSION_NAME-release.apk"
          fi

          if [ -f "$RELEASE_DIR/app-arm64-v8a-release.apk" ]; then
            cp "$RELEASE_DIR/app-arm64-v8a-release.apk" "$RELEASE_DIR/heast-music-v$VERSION_NAME-arm64-v8a.apk"
          else
            cp "$RELEASE_DIR/heast-music-v$VERSION_NAME-release.apk" "$RELEASE_DIR/heast-music-v$VERSION_NAME-arm64-v8a.apk"
          fi

          if [ -f "$RELEASE_DIR/app-armeabi-v7a-release.apk" ]; then
            cp "$RELEASE_DIR/app-armeabi-v7a-release.apk" "$RELEASE_DIR/heast-music-v$VERSION_NAME-armeabi-v7a.apk"
          else
            cp "$RELEASE_DIR/heast-music-v$VERSION_NAME-release.apk" "$RELEASE_DIR/heast-music-v$VERSION_NAME-armeabi-v7a.apk"
          fi

          if [ -f "$DEBUG_DIR/app-universal-debug.apk" ]; then
            cp "$DEBUG_DIR/app-universal-debug.apk" "$DEBUG_DIR/heast-music-v$VERSION_NAME-debug.apk"
          else
            cp "$DEBUG_DIR/app-debug.apk" "$DEBUG_DIR/heast-music-v$VERSION_NAME-debug.apk"
          fi

          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "release_path=$RELEASE_DIR/heast-music-v$VERSION_NAME-release.apk" >> "$GITHUB_OUTPUT"
          echo "arm64_path=$RELEASE_DIR/heast-music-v$VERSION_NAME-arm64-v8a.apk" >> "$GITHUB_OUTPUT"
          echo "arm32_path=$RELEASE_DIR/heast-music-v$VERSION_NAME-armeabi-v7a.apk" >> "$GITHUB_OUTPUT"
          echo "debug_path=$DEBUG_DIR/heast-music-v$VERSION_NAME-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ steps.apk.outputs.version }}
          VERSION_NAME: ${{ steps.apk.outputs.version }}
        run: |
          cat > RELEASE_NOTES.md <<EOF
          ## Heast Music v$VERSION_NAME

          - Native Android music backend based on YouTube Music InnerTube.
          - Native search, suggestions, home shelves, playlists, radio and stream resolution.
          - LRCLIB synced and plain lyrics with the existing translation and cache pipeline.
          - Release APK signed automatically with the Android debug signing configuration.
          - No repository signing secrets are required.
          
          **Install note:** automatic debug signing avoids manual keystore setup. If the signing certificate changes between builds, uninstall the previous APK before installing the new one.
          EOF

          gh release delete "$RELEASE_TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$RELEASE_TAG" \
            "${{ steps.apk.outputs.release_path }}" \
            "${{ steps.apk.outputs.arm64_path }}" \
            "${{ steps.apk.outputs.arm32_path }}" \
            "${{ steps.apk.outputs.debug_path }}" \
            --title "Heast Music v$VERSION_NAME" \
            --notes-file RELEASE_NOTES.md \
            --latest

      - name: Upload APK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Heast-Music-${{ steps.apk.outputs.version }}-APKs
          path: |
            ${{ steps.apk.outputs.release_path }}
            ${{ steps.apk.outputs.arm64_path }}
            ${{ steps.apk.outputs.arm32_path }}
            ${{ steps.apk.outputs.debug_path }}
          retention-days: 30
